<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">
        <h2>🏆 Certificate Manager</h2>
      </div>
      <div class="search-wrapper">
        <input type="text" id="search-input" placeholder="🔍 Search by name or ID...">
      </div>
      <select id="course-filter">
        <option value="">Filter by Course</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Mathematics">Mathematics</option>
        <option value="Physics">Physics</option>
        <option value="Engineering">Engineering</option>
        <option value="Arts">Arts</option>
      </select>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Add Certificate Card -->
      <section class="card">
        <h3>📝 Issue New Certificate</h3>
        <form id="certificate-form">
          <div class="form-group">
            <label for="recipient-name">Recipient Name</label>
            <input type="text" id="recipient-name" required>
          </div>
          <div class="form-group">
            <label for="course-name">Course / Event Name</label>
            <input type="text" id="course-name" required>
          </div>
          <div class="form-group">
            <label for="issue-date">Issue Date</label>
            <input type="date" id="issue-date" required>
          </div>
          <div class="form-group">
            <label for="grade">Grade / Performance</label>
            <input type="text" id="grade" placeholder="e.g., A+, First Class, Distinction">
          </div>
          <div class="form-group">
            <label for="certificate-id">Certificate ID</label>
            <small>(Auto-generated: <span id="auto-id">CERT-2026-0001</span>)</small>
            <input type="text" id="certificate-id">
          </div>
          <button type="submit" class="btn-submit">Issue Certificate</button>
        </form>
      </section>

      <!-- Certificates Table Card -->
      <section class="card">
        <h3>📋 Certificate Records</h3>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Recipient</th>
                <th>Course</th>
                <th>Date</th>
                <th>Grade</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="certificate-table">
              <!-- Table rows generated by JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Certificate Preview Modal -->
  <div id="certificate-modal" class="modal">
    <div modal-obj="main" class="modal-content">
      <span modal-obj="close" class="close-btn">&times;</span>
      <h3>🏆 Certificate Preview</h3>
      <div class="certificate-card" id="certificate-preview">
        <div class="badge">Certificate</div>
        <h4 id="preview-recipient">Recipient Name</h4>
        <p id="preview-course">Course / Event</p>
        <p id="preview-date">Issue Date: <span></span></p>
        <p id="preview-grade">Grade: <span></span></p>
        <p id="preview-id">Certificate ID: <span></span></p>
        <div class="action-buttons">
          <button class="btn-print" onclick="window.print()">🖨️ Print Certificate</button>
          <button class="btn-close" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
